<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#071014" />
    <title>Page not found — Sink Space</title>
    <link rel="icon" href="./mark.svg" type="image/svg+xml" />
    <style>
      :root{color-scheme:dark;--bg:#071014;--text:#eef7f4;--muted:#91a8a6;--line:rgba(210,239,234,.2);--acid:#a8ff5b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(100%,720px);padding:42px;border:1px solid var(--line);border-radius:22px}.kicker{margin:0 0 28px;color:var(--acid);font-size:.72rem;font-weight:800;letter-spacing:.14em}h1{margin:0;font-size:clamp(3rem,9vw,6rem);font-weight:520;letter-spacing:-.06em;line-height:.95}p{max-width:540px;margin:24px 0 34px;color:var(--muted);font-size:1.05rem;line-height:1.65}a{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:999px;color:var(--text);font-weight:750;text-decoration:none}a:hover,a:focus-visible{background:var(--acid);border-color:var(--acid);color:var(--bg)}
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="kicker">404 / SINK SPACE</p>
      <h1>That page<br />isn’t here.</h1>
      <p>The address may have changed or the page may not exist. Return to the Sink Space homepage to see the current products.</p>
      <a href="/">Back to Sink Space</a>
    </main>
  </body>
</html>
